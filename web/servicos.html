<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços - Beleza Ágil</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body data-page="servicos">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <span class="sidebar-brand-icon">💅</span>
                <div class="sidebar-brand-text">
                    <h1>Beleza Ágil</h1>
                    <span>Gestão de Serviços</span>
                </div>
            </div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
            <div class="sidebar-footer">
                <p>v3.0 — Web + API REST</p>
            </div>
        </aside>

        <main class="main-content">
            <header class="page-header">
                <h2>Serviços</h2>
                <p>Cadastre e gerencie os serviços oferecidos pela esmalteria.</p>
            </header>

            <div id="alert-container" class="alert"></div>

            <div class="content-grid content-grid-2">
                <section class="card">
                    <div class="card-header">
                        <h3 id="form-title">Cadastrar serviço</h3>
                    </div>
                    <form id="form-servico" novalidate>
                        <div class="form-group">
                            <label for="nome">Nome do serviço <span class="required">*</span></label>
                            <input type="text" id="nome" class="form-control" maxlength="200" required>
                            <span class="form-error"></span>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="tempo">Tempo de execução (min) <span class="required">*</span></label>
                                <input type="number" id="tempo" class="form-control" min="1" placeholder="Ex: 30" required>
                                <span class="form-error"></span>
                            </div>
                            <div class="form-group">
                                <label for="valor">Valor (R$) <span class="required">*</span></label>
                                <input type="text" id="valor" class="form-control" placeholder="Ex: 45,00" required>
                                <span class="form-error"></span>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="button" id="btn-cancelar" class="btn btn-secondary">Cancelar</button>
                            <button type="button" id="btn-excluir" class="btn btn-danger" disabled>Excluir</button>
                            <button type="submit" class="btn btn-success">Salvar</button>
                        </div>
                    </form>
                </section>

                <section class="card">
                    <div class="card-header">
                        <h3>Lista de Serviços</h3>
                    </div>
                    <div class="search-box">
                        <input type="text" id="busca-servico" class="form-control" placeholder="Buscar por nome...">
                    </div>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nome</th>
                                    <th>Tempo</th>
                                    <th>Valor</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-servicos"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="js/constants.js"></script>
    <script src="js/validators.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/servicos.js"></script>
</body>
</html>
