<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profissionais - Beleza Ágil</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body data-page="profissionais">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <span class="sidebar-brand-icon">💅</span>
                <div class="sidebar-brand-text">
                    <h1>Beleza Ágil</h1>
                    <span>Gestão de Serviços</span>
                </div>
            </div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
            <div class="sidebar-footer">
                <p>v3.0 — Web + API REST</p>
            </div>
        </aside>

        <main class="main-content">
            <header class="page-header">
                <h2>Profissionais</h2>
                <p>Cadastre e gerencie os profissionais da esmalteria (máximo 5).</p>
            </header>

            <div id="alert-container" class="alert"></div>
            <p id="contador-profissionais" class="badge badge-primary" style="margin-bottom: 1rem; display: inline-block;"></p>

            <div class="content-grid content-grid-2">
                <section class="card">
                    <div class="card-header">
                        <h3 id="form-title">Cadastrar profissional</h3>
                    </div>
                    <form id="form-profissional" novalidate>
                        <div class="form-group">
                            <label for="nome">Nome do profissional <span class="required">*</span></label>
                            <input type="text" id="nome" class="form-control" maxlength="200" required>
                            <span class="form-error"></span>
                        </div>
                        <div class="form-group">
                            <label for="data-nascimento">Data de nascimento <span class="required">*</span></label>
                            <input type="date" id="data-nascimento" class="form-control" required>
                            <span class="form-error"></span>
                        </div>
                        <div class="form-group">
                            <label for="cpf">CPF <span class="required">*</span></label>
                            <input type="text" id="cpf" class="form-control" maxlength="14" placeholder="000.000.000-00" required>
                            <span class="form-error"></span>
                        </div>
                        <div class="form-group">
                            <label for="email">E-mail <span class="required">*</span></label>
                            <input type="email" id="email" class="form-control" maxlength="200" required>
                            <span class="form-error"></span>
                        </div>
                        <div class="form-group">
                            <label for="funcao">Função <span class="required">*</span></label>
                            <select id="funcao" class="form-control" required></select>
                            <span class="form-error"></span>
                        </div>
                        <div class="form-actions">
                            <button type="button" id="btn-cancelar" class="btn btn-secondary">Cancelar</button>
                            <button type="button" id="btn-excluir" class="btn btn-danger" disabled>Excluir</button>
                            <button type="submit" class="btn btn-success">Salvar</button>
                        </div>
                    </form>
                </section>

                <section class="card">
                    <div class="card-header">
                        <h3>Lista de Profissionais</h3>
                    </div>
                    <div class="search-box">
                        <input type="text" id="busca-profissional" class="form-control" placeholder="Buscar por nome ou função...">
                    </div>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nome</th>
                                    <th>Nascimento</th>
                                    <th>CPF</th>
                                    <th>E-mail</th>
                                    <th>Função</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-profissionais"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="js/constants.js"></script>
    <script src="js/validators.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/profissionais.js"></script>
</body>
</html>
